<div class="tabs">
  <button class="tab-btn" data-tab="dashboard" hx-get="{% url 'cms:cms-dashboard-tab' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">Dashboard</button>
  <button class="tab-btn" data-tab="notices" hx-get="{% url 'cms:cms-notices-tab' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">📢 Notices</button>
  <button class="tab-btn" data-tab="new" hx-get="{% url 'cms:cms-new-entry' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">+ New Upload</button>
  <button class="tab-btn" data-tab="all" hx-get="{% url 'cms:cms-all-entries' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">All Uploads</button>
  <button class="tab-btn" data-tab="sponsors" hx-get="{% url 'cms:cms-sponsors' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">Sponsors</button>
  <button class="tab-btn" data-tab="leaderboard" hx-get="{% url 'cms:cms-leaderboard' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">Top 5</button>
  {% if user.is_admin %}
  <button class="tab-btn" data-tab="admin" hx-get="{% url 'cms:cms-admin' %}" hx-target="#tab-content" hx-trigger="click" hx-swap="innerHTML">Admin</button>
  {% endif %}
</div>
