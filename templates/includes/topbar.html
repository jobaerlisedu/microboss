{% load static %}
<div class="topbar">
  <div class="topbar-left">
    <button class="hamburger-btn" id="sidebarToggle" onclick="toggleSidebarMobile()" title="Toggle sidebar">
      <i class="bi bi-list"></i>
    </button>

  </div>

  <div class="topbar-right">
    <div class="clockbox">
      <div class="time" id="clockTime">--:--:--</div>
      <div id="clockDate" class="date-str">Loading…</div>
      <div class="wx" id="clockWx">Weather…</div>
    </div>

    <div class="notif-container" id="notif-container">
      <button class="icon-btn notif-bell" id="notif-bell"
        title="Notifications" aria-expanded="false" aria-label="Notifications">
        <span><i class="bi bi-bell-fill"></i></span>
        <span class="notif-badge" id="notif-badge"
          hx-get="/api/v1/notifications/count/"
          hx-trigger="load, every 30s, notification-update from:body"
          hx-target="this"
          hx-swap="innerHTML"></span>
      </button>
      <div class="notif-dropdown" id="notif-dropdown"><div id="notif-dropdown-content"></div></div>
    </div>

    <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme" onclick="toggleTheme()">
      <span><i class="bi bi-moon-fill"></i></span>
    </button>



    <div class="profile-chip">
      <span class="avatar">{{ user.username|first|upper }}</span>
      <span class="username">{{ user.username }}</span>
      <form method="post" action="/cms/logout/" style="display:inline;margin:0;">
        {% csrf_token %}
        <button type="submit" class="logout-btn" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
      </form>
    </div>
  </div>
</div>
