<button class="float-btn" id="btnContributors" title="Top Contributors" style="bottom:80px;"><i class="bi bi-people-fill"></i></button>
<div class="float-panel hidden" id="panelContributors" style="bottom:80px;" role="region" aria-label="Top Contributors">
  <h4><i class="bi bi-people-fill" style="color:#22c55e;"></i> Top Contributors</h4>
  <div id="contribMini" class="float-panel-content" data-url="/cms/widgets/contributors/" data-interval="30"></div>
</div>

<button class="float-btn" id="btnLeaderboard" title="Top 5" style="bottom:138px;"><i class="bi bi-trophy-fill"></i></button>
<div class="float-panel hidden" id="panelLeaderboard" style="bottom:138px;" role="region" aria-label="Top 5 Leaderboard">
  <h4><i class="bi bi-trophy-fill"></i> Top 5 (Live)</h4>
  <div id="lbMini" class="float-panel-content" data-url="/cms/widgets/leaderboard/" data-interval="15"></div>
</div>

<button class="float-btn" id="btnSponsorTrack" title="Sponsor Track" style="bottom:196px;"><i class="bi bi-bar-chart-fill"></i></button>
<div class="float-panel hidden" id="panelSponsorTrack" style="bottom:196px;" role="region" aria-label="Live Sponsor Track">
  <h4><i class="bi bi-bar-chart-fill"></i> Live Sponsor Track</h4>
  <div id="spMini" class="float-panel-content" data-url="/cms/widgets/sponsor-track/" data-interval="15"></div>
</div>

<script>
(function() {
  function loadPanel(content) {
    if (content.dataset.loaded) return;
    content.dataset.loaded = '1';
    content.setAttribute('hx-get', content.dataset.url);
    content.setAttribute('hx-trigger', 'load, every ' + content.dataset.interval + 's');
    content.setAttribute('hx-swap', 'innerHTML');
    htmx.process(content);
    htmx.trigger(content, 'load');
  }

  function unloadPanel(content) {
    if (!content.dataset.loaded) return;
    content.removeAttribute('hx-get');
    content.removeAttribute('hx-trigger');
    content.removeAttribute('hx-swap');
    delete content.dataset.loaded;
    htmx.process(content);
  }

  function togglePanel(btnId, panelId) {
    var btn = document.getElementById(btnId);
    var panel = document.getElementById(panelId);
    if (!btn || !panel) return;
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var hidden = panel.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', !hidden);
      var content = panel.querySelector('.float-panel-content');
      if (content) {
        if (hidden) { unloadPanel(content); } else { loadPanel(content); }
      }
    });
  }

  togglePanel('btnContributors', 'panelContributors');
  togglePanel('btnLeaderboard', 'panelLeaderboard');
  togglePanel('btnSponsorTrack', 'panelSponsorTrack');
})();
</script>
