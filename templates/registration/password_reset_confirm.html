{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset — Channel One Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div id="bgOverlay"></div>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div style="width:100px;height:100px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;padding:6px;">
        <img src="{% static 'images/logo.svg' %}" alt="Channel One" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:contain;">
      </div>
      <h2 style="margin:0 0 4px;font-size:20px;">
        {% if done %}Reset Complete!{% else %}Set New Password{% endif %}
      </h2>
    </div>

    {% if done %}
    <div style="text-align:center;padding:18px 0;">
      <div style="font-size:42px;margin-bottom:12px;">✅</div>
      <p style="color:var(--text-soft);font-size:14px;">Your password has been reset successfully.</p>
    </div>
    <a href="{% url 'cms:cms-login' %}" class="btn btn-primary btn-block" style="text-decoration:none;text-align:center;">Login</a>

    {% else %}
    <form method="post" action="{% url 'cms:cms-password-reset-confirm' %}">
      {% csrf_token %}
      <div class="field" style="margin-bottom:12px;">
        <label>New Password *</label>
        <input type="password" name="password" placeholder="At least 4 characters" required minlength="4">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Confirm New Password *</label>
        <input type="password" name="password2" placeholder="Type again" required minlength="4">
      </div>
      {% if error %}
      <div class="err-box">{{ error }}</div>
      {% endif %}
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>
    {% endif %}
  </div>
</div>
</body>
</html>
