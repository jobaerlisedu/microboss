<div class="notif-header">
  <span>Notifications</span>
  {% if unread_count > 0 %}
  <button class="btn btn-ghost btn-xs" hx-post="/api/v1/notifications/read-all/" hx-target="#notif-dropdown" hx-swap="outerHTML">Mark all as read</button>
  {% endif %}
</div>
<div class="notif-list">
{% for n in notifications %}
  <button class="notif-item {% if not n.is_read %}unread{% endif %}"
    hx-post="/api/v1/notifications/{{ n.id }}/read/"
    hx-trigger="click"
    hx-swap="none">
    <div class="notif-title">{{ n.title }}</div>
    {% if n.message %}<div class="notif-msg">{{ n.message|truncatechars:80 }}</div>{% endif %}
    <div class="notif-time">{{ n.created_at|date:"Y-m-d H:i" }}</div>
  </button>
{% empty %}
  <div class="notif-empty">No notifications</div>
{% endfor %}
</div>
