<div class="card phoenix-card">
  <div class="card-header-flex" style="margin-bottom: 18px;">
    <div>
      <h3 class="phoenix-card-title"><i class="bi bi-pencil-fill" style="color:#f59e0b;margin-right:6px;"></i> Edit Digital Script</h3>
      <p class="phoenix-card-sub">{{ script.headline|default:'Untitled Script' }}</p>
    </div>
  </div>

  <form method="post" action="/cms/scripts/save/" hx-post="/cms/scripts/save/" hx-target="#tab-content" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="hidden" name="script_id" value="{{ script.id }}">
    <div class="form-grid">
      <div class="field full">
        <label><i class="bi bi-pin-angle-fill" style="color:#f59e0b;"></i> Link to Assignment <span style="font-size:10.5px;font-weight:500;color:var(--text-faint);">(Optional)</span></label>
        <select name="assignment_id" style="font-size:12px;">
          <option value="">— No Assignment —</option>
          {% for a in today_assignments %}
          <option value="{{ a.id }}" {% if script.assignment_id|stringformat:'s' == a.id|stringformat:'s' %}selected{% endif %}>{{ a.caption|truncatechars:45 }} — {{ a.reporter }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Date *</label>
        <input type="date" name="script_date" value="{{ script.script_date|date:'Y-m-d' }}" required>
      </div>
      <div class="field">
        <label>Working Headline *</label>
        <input type="text" name="headline" value="{{ script.headline }}" required>
      </div>
      <div class="field">
        <label>Content Source *</label>
        <select name="source" required>
          <option value="district" {% if script.source == 'district' %}selected{% endif %}>District</option>
          <option value="reuters" {% if script.source == 'reuters' %}selected{% endif %}>Reuters</option>
          <option value="social" {% if script.source == 'social' %}selected{% endif %}>Social Media</option>
          <option value="studio" {% if script.source == 'studio' %}selected{% endif %}>Studio Shoot</option>
        </select>
      </div>
      <div class="field">
        <label>District Name</label>
        <input type="text" name="district" value="{{ script.district|default:'' }}">
      </div>
      <div class="field">
        <label>District Reporter</label>
        <input type="text" name="district_reporter" value="{{ script.district_reporter|default:'' }}">
      </div>
      <div class="field full">
        <label>Script Content</label>
        <textarea name="body" rows="10" style="resize:vertical;">{{ script.body|default:'' }}</textarea>
      </div>
      <div class="field full">
        <label><i class="bi bi-journal-text"></i> Change Summary <span style="font-size:11px;color:var(--text-faint);">(Describe what changed)</span></label>
        <textarea name="change_summary" rows="2" placeholder="e.g. Updated headline, corrected district name" style="resize:vertical;"></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px;">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
      <button type="button" class="btn btn-ghost" hx-get="/cms/scripts/{{ script.id }}/" hx-target="#tab-content" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
</div>
