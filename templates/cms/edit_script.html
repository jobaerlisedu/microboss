<div class="card phoenix-card">
  <div class="card-header-flex" style="margin-bottom: 18px;">
    <div>
      <h3 class="phoenix-card-title"><i class="bi bi-pencil-fill" style="color:#f59e0b;margin-right:6px;"></i> Edit Digital Script</h3>
      <p class="phoenix-card-sub">{{ script.headline|default:'Untitled Script' }}</p>
    </div>
  </div>

  <form method="post" action="/cms/scripts/save/" hx-post="/cms/scripts/save/" hx-target="#tab-content" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="hidden" name="script_id" value="{{ script.id }}">
    <div class="form-grid">
      <div class="field">
        <label>Date *</label>
        <input type="date" name="script_date" value="{{ script.script_date|date:'Y-m-d' }}" required>
      </div>
      <div class="field">
        <label>Working Headline *</label>
        <input type="text" name="headline" value="{{ script.headline }}" required>
      </div>
      <div class="field">
        <label>Content Source *</label>
        <select name="source" required>
          <option value="district" {% if script.source == 'district' %}selected{% endif %}>District</option>
          <option value="reuters" {% if script.source == 'reuters' %}selected{% endif %}>Reuters</option>
          <option value="social" {% if script.source == 'social' %}selected{% endif %}>Social Media</option>
          <option value="studio" {% if script.source == 'studio' %}selected{% endif %}>Studio Shoot</option>
        </select>
      </div>
      <div class="field">
        <label>District Name</label>
        <input type="text" name="district" value="{{ script.district|default:'' }}">
      </div>
      <div class="field">
        <label>District Reporter</label>
        <input type="text" name="district_reporter" value="{{ script.district_reporter|default:'' }}">
      </div>
      <div class="field full">
        <label>Script Content</label>
        <textarea name="body" rows="10" style="resize:vertical;">{{ script.body|default:'' }}</textarea>
      </div>
      <div class="field full">
        <div class="assignment-panel" style="border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:4px;background:var(--surface);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <label style="font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;">
              <i class="bi bi-pin-angle-fill" style="color:#f59e0b;"></i> Link to Assignment <span style="font-size:10.5px;font-weight:500;color:var(--text-faint);">(Optional)</span>
            </label>
            <span style="font-size:10.5px;color:var(--text-soft);">{{ today_assignments|length }} today</span>
          </div>
          {% if today_assignments %}
          <div style="display:flex;flex-direction:column;gap:3px;margin-bottom:8px;max-height:150px;overflow-y:auto;">
            {% for a in today_assignments %}
            <label data-value="{{ a.id }}" style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11.5px;transition:background 0.15s;{% if script.assignment_id|stringformat:'s' == a.id|stringformat:'s' %}background:rgba(245,158,11,0.12);{% endif %}"
                   onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background='{% if script.assignment_id|stringformat:'s' == a.id|stringformat:'s' %}rgba(245,158,11,0.12){% else %}transparent{% endif %}'"
                   onclick="document.getElementById('scAsSelect').value='{{ a.id }}';this.parentElement.querySelectorAll('label[data-value]').forEach(function(el){el.style.background='transparent'});this.style.background='rgba(245,158,11,0.12)';">
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ a.caption|truncatechars:50 }}</div>
                <div style="font-size:10px;color:var(--text-soft);">
                  <span><i class="bi bi-person"></i> {{ a.reporter }}</span>
                  {% if a.district %}<span style="margin-left:6px;"><i class="bi bi-geo-alt"></i> {{ a.district }}</span>{% endif %}
                </div>
              </div>
              <span class="status-pill status-{{ a.status|lower }}" style="font-size:9px;padding:1px 7px;">{{ a.status }}</span>
            </label>
            {% endfor %}
          </div>
          {% else %}
          <div style="font-size:11px;color:var(--text-faint);padding:6px 0;margin-bottom:6px;"><i class="bi bi-info-circle"></i> No assignments today</div>
          {% endif %}
          <select id="scAsSelect" name="assignment_id" style="font-size:11.5px;">
            <option value="">— No Assignment —</option>
            {% for a in today_assignments %}
            <option value="{{ a.id }}" {% if script.assignment_id|stringformat:'s' == a.id|stringformat:'s' %}selected{% endif %}>{{ a.caption|truncatechars:45 }} — {{ a.reporter }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field full">
        <label><i class="bi bi-journal-text"></i> Change Summary <span style="font-size:11px;color:var(--text-faint);">(Describe what changed)</span></label>
        <textarea name="change_summary" rows="2" placeholder="e.g. Updated headline, corrected district name" style="resize:vertical;"></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px;">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
      <button type="button" class="btn btn-ghost" hx-get="/cms/scripts/{{ script.id }}/" hx-target="#tab-content" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
</div>
