<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-top:8px;">
  <h4 style="margin:0 0 12px;font-size:14px;color:var(--text);display:flex;align-items:center;gap:6px;">
    <i class="bi bi-shield-check"></i> Edit Permissions: <strong>{{ group.name }}</strong>
  </h4>
  <form method="post" hx-post="{% url 'cms:cms-save-role' %}" hx-target="#tab-content" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="hidden" name="role_id" value="{{ group.id }}">
    <div class="field" style="margin-bottom:14px;">
      <label>Role Name</label>
      <input type="text" name="name" value="{{ group.name }}" required style="max-width:300px;">
    </div>
    <div style="max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;">
      {% for app_label, app_data in permission_tree.items %}
      <details style="margin-bottom:6px;"{% if forloop.first %} open{% endif %}>
        <summary style="cursor:pointer;font-weight:700;font-size:12px;color:var(--text);padding:4px 0;letter-spacing:0.3px;">{{ app_data.verbose_name }}</summary>
        {% for model_name, model_data in app_data.models.items %}
        <div style="padding:4px 0 4px 12px;margin:2px 0;">
          <div style="font-weight:600;font-size:12px;color:var(--text-soft);margin-bottom:3px;">{{ model_data.verbose_name }}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">
            {% for p in model_data.perms %}
            <label style="display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--border);cursor:pointer;{% if p.id in selected %}border-color:#3b82f6;background:rgba(59,130,246,0.08);{% endif %}">
              <input type="checkbox" name="permissions" value="{{ p.id }}"{% if p.id in selected %} checked{% endif %} style="accent-color:#3b82f6;">
              {{ p.name }}
            </label>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </details>
      {% endfor %}
    </div>
    <div class="form-actions" style="margin-top:14px;">
      <button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('div[id]').innerHTML=''">Cancel</button>
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Save Permissions</button>
    </div>
  </form>
</div>
