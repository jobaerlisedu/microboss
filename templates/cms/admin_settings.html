<div class="admin-subnav" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-admin' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-people-fill"></i> Users</button>
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-roles' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-shield-lock-fill"></i> Roles &amp; Perms</button>
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-admin-audit' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-journal-check"></i> Audit Log</button>
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-admin-health' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-activity"></i> System Health</button>
  <button class="btn btn-primary btn-sm active" hx-get="{% url 'cms:cms-admin-settings' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-sliders"></i> Settings</button>
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-admin-activity' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-clock-history"></i> Activity</button>
  <button class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-admin-csv-import' %}" hx-target="#tab-content" hx-swap="innerHTML"><i class="bi bi-file-earmark-spreadsheet-fill"></i> CSV Import</button>
</div>

<div class="card phoenix-card">
  <div class="card-header-flex" style="margin-bottom: 18px;">
    <div>
      <h3 class="phoenix-card-title"><i class="bi bi-sliders" style="color:#3b82f6;margin-right:6px;"></i> Site Settings</h3>
      <p class="phoenix-card-sub">Global registration and access preferences</p>
    </div>
  </div>

  <form hx-post="{% url 'cms:cms-admin-settings' %}" hx-target="#tab-content" hx-swap="innerHTML" style="max-width:500px;">
    {% csrf_token %}
    <div class="field" style="margin-bottom:16px;">
      <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);">
        <input type="checkbox" name="registration_enabled" value="1" {% if registration_enabled == '1' %}checked{% endif %} onchange="document.querySelector('[name=reg_msg_wrapper]').style.display=this.checked?'none':'block'">
        Enable User Registrations
      </label>
      <small style="color:var(--text-faint);display:block;margin-left:24px;">When disabled, new users cannot create accounts.</small>
    </div>

    <div class="field" name="reg_msg_wrapper" style="margin-bottom:16px;{% if registration_enabled == '1' %}display:none;{% endif %}">
      <label>Registration Disabled Message</label>
      <textarea name="registration_message" rows="2" style="width:100%;">{{ registration_message }}</textarea>
    </div>

    <div class="form-actions" style="margin-top:20px;">
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Save Settings</button>
    </div>
  </form>
</div>
