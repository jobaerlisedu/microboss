<button class="modal-close" onclick="closeModal()">&times;</button>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
  <span style="width:36px;height:36px;border-radius:10px;background:rgba(59,130,246,0.12);color:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;"><i class="bi bi-megaphone-fill"></i></span>
  <div>
    <h3 style="margin:0;">{{ notice.title }}</h3>
  </div>
</div>
<div class="meta"><i class="bi bi-clock"></i> {{ notice.created_at|date:"M d, Y H:i" }} &mdash; <i class="bi bi-person"></i> {{ notice.created_by.full_name|default:notice.created_by.username|default:"System" }}</div>
<div class="body">{{ notice.content }}</div>
