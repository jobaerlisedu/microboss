<div class="card phoenix-card">
  <div class="card-header-flex" style="margin-bottom: 18px;">
    <div>
      <h3 class="phoenix-card-title"><i class="bi bi-file-earmark-code-fill" style="color:#3b82f6;margin-right:6px;"></i> New Digital Script</h3>
      <p class="phoenix-card-sub">Compose script for broadcast or teleprompter</p>
    </div>
  </div>

  <form method="post" action="{% url 'cms:cms-save-script' %}" hx-post="{% url 'cms:cms-save-script' %}" hx-target="#tab-content" hx-swap="innerHTML">
    {% csrf_token %}
    <div class="form-grid">
      <div class="field full">
        <label><i class="bi bi-pin-angle-fill" style="color:#f59e0b;"></i> Link to Assignment <span style="font-size:10.5px;font-weight:500;color:var(--text-faint);">(Optional)</span></label>
        <select name="assignment_id" style="font-size:12px;">
          <option value="">— No Assignment —</option>
          {% for a in today_assignments %}
          <option value="{{ a.id }}">{{ a.caption|truncatechars:45 }} — {{ a.reporter }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Script Creator Name</label>
        <input type="text" value="{{ request.user.full_name|default:request.user.username }}" readonly style="background-color: var(--bg-hover); color: var(--text-soft); cursor: not-allowed;" title="Creator is fixed to your logged-in account">
      </div>
      <div class="field">
        <label>Date *</label>
        <input type="date" name="script_date" value="{{ today }}" required>
      </div>
      <div class="field">
        <label>Working Headline *</label>
        <input type="text" name="headline" placeholder="Script headline" required>
      </div>
      <div class="field">
        <label>Thumbnail Text</label>
        <input type="text" name="district_reporter" placeholder="Thumbnail text">
      </div>
    </div>

    <div class="form-grid grid-3" style="margin-top:14px;">
      <div class="field">
        <label>Content Source *</label>
        <select name="source" required>
          <option value="">Select Source</option>
          <option value="district">District</option>
          <option value="reuters">Reuters</option>
          <option value="social">Social Media</option>
          <option value="studio">Studio Shoot</option>
        </select>
      </div>
      <div class="field">
        <label>District Name</label>
        <input type="text" name="district" placeholder="District name">
      </div>
      <div class="field">
        <label><i class="bi bi-person-badge-fill"></i> Reporter Name <span class="opt" style="font-size:11px;color:var(--text-faint);">(Optional)</span></label>
        <input type="text" name="reporter_name" placeholder="Reporter name...">
      </div>
    </div>

    <div class="form-grid grid-2" style="margin-top:12px;">
      <div class="field">
        <label><i class="bi bi-card-text"></i> Description <span class="opt" style="font-size:11px;color:var(--text-faint);">(Optional)</span></label>
        <textarea name="description" placeholder="Brief description..." rows="2"></textarea>
      </div>
      <div class="field">
        <label><i class="bi bi-exclamation-triangle-fill"></i> Special Note <span class="opt" style="font-size:11px;color:var(--text-faint);">(Optional)</span></label>
        <textarea name="special_note" placeholder="Any special note..." rows="2"></textarea>
      </div>
    </div>

    <div class="form-grid grid-2" style="margin-top:12px;">
      <div class="field">
        <label><i class="bi bi-hash"></i> Hashtags <span class="opt" style="font-size:11px;color:var(--text-faint);">(Optional)</span></label>
        <input type="text" name="hashtags" placeholder="#tag1 #tag2">
      </div>
      <div class="field">
        <label><i class="bi bi-tags-fill"></i> Keywords <span class="opt" style="font-size:11px;color:var(--text-faint);">(Optional)</span></label>
        <input type="text" name="keywords" placeholder="comma, separated, keywords">
      </div>
    </div>

    <div class="form-grid" style="margin-top:14px;">
      <div class="field full">
        <label>Script Content</label>
        <textarea name="body" rows="8" placeholder="Write script content here..."></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:20px;">
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-check-lg"></i> Save Script</button>
      <button type="button" class="btn btn-ghost btn-sm" hx-get="{% url 'cms:cms-scripts' %}" hx-target="#tab-content" hx-swap="innerHTML">Cancel</button>
    </div>
  </form>
</div>
