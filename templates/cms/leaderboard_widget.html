{% for u in top_users %}
<div class="lb-row">
  <div class="lb-rank">{{ forloop.counter }}</div>
  <div class="lb-name">{{ u.username }}</div>
  <div class="lb-count">{{ u.entry_count }}</div>
</div>
{% empty %}
<p style="color:var(--text-faint);font-size:12px;">কোনো ডেটা নেই</p>
{% endfor %}
{% if is_winner %}
<script>fireConfetti();</script>
{% endif %}
